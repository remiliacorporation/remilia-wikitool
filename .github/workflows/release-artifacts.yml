name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.3.1)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release and attach zips"
        required: false
        type: boolean
        default: true
      notarize_macos:
        description: "Developer ID-sign and notarize macOS archives (requires Apple secrets)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary_name: wikitool
          # macos-26 is arm64; macos-26-intel is x64. Keep these explicit so
          # each artifact is built on the native architecture it ships for.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary_name: wikitool
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary_name: wikitool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary_name: wikitool.exe

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve release names
        id: names
        shell: bash
        run: |
          # Release versions are bare semver (no leading v); strip one if present.
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          if [[ ! "${RAW}" =~ $re ]]; then
            echo "Invalid artifact_version: ${RAW}"
            echo "Expected a bare semver version, e.g. 0.3.1"
            exit 1
          fi
          version="${RAW#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundle=wikitool-${version}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.artifact_version }}

      - name: Stage pinned Contextmink release pack
        shell: bash
        run: >
          bash scripts/fetch_contextmink.sh
          --platform ${{ matrix.platform }}
          --dest dist/contextmink-dist

      - name: Build + package versioned release bundle
        run: >
          cargo run --quiet --package wikitool --features maintainer --
          release build-matrix
          --targets ${{ matrix.target }}
          --artifact-version ${{ steps.names.outputs.version }}
          --output-dir dist/release-matrix
          --contextmink-dist dist/contextmink-dist

      - name: Configure Apple Developer ID signing
        if: runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_P8 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID
          do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required macOS release secret: ${required}" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/wikitool-developer-id.p12"
          keychain_path="$RUNNER_TEMP/wikitool-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "Imported certificate has no Developer ID Application identity" >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Sign and notarize macOS release
        if: runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          bundle="dist/release-matrix/${{ steps.names.outputs.bundle }}"
          bash scripts/sign_notarize_macos.sh \
            --bundle-dir "$bundle" \
            --zip-path "${bundle}.zip" \
            --identity "$APPLE_SIGNING_IDENTITY" \
            --identifier-prefix "org.remilia.wikitool" \
            --notary-key "$APPLE_NOTARY_KEY_PATH" \
            --notary-key-id "$APPLE_NOTARY_KEY_ID" \
            --notary-issuer "$APPLE_NOTARY_ISSUER_ID" \
            --evidence-dir "dist/notarization/${{ steps.names.outputs.bundle }}"
          (
            cd dist/release-matrix
            shasum -a 256 *.zip | sort -k2 > SHA256SUMS.txt
          )

      - name: Declare unsigned GitHub macOS release
        if: runner.os == 'macOS' && !inputs.notarize_macos
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/release-matrix/${{ steps.names.outputs.bundle }}"
          bash scripts/declare_unsigned_macos.sh --bundle-dir "$bundle"
          rm -f "${bundle}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "${bundle}.zip"
          (
            cd dist/release-matrix
            shasum -a 256 *.zip | sort -k2 > SHA256SUMS.txt
          )
          echo "::warning::macOS archive is unsigned; Gatekeeper exception instructions are bundled"

      - name: Verify packaged release (Unix)
        if: runner.os != 'Windows'
        env:
          BUNDLE: dist/release-matrix/${{ steps.names.outputs.bundle }}
        run: |
          test -f "$BUNDLE/${{ matrix.binary_name }}"
          "$BUNDLE/${{ matrix.binary_name }}" --version
          test -f "$BUNDLE/AGENTS.md"
          test -f "$BUNDLE/CLAUDE.md"
          test -d "$BUNDLE/.claude/rules"
          test -d "$BUNDLE/.claude/skills"
          cmp -s "$BUNDLE/AGENTS.md" "$BUNDLE/CLAUDE.md"
          test -f "$BUNDLE/codex_skills/wiki-writing/SKILL.md"
          test -f "$BUNDLE/codex_skills/prose-review/SKILL.md"
          test -f "$BUNDLE/codex_skills/wiki-interview/SKILL.md"
          test -f "$BUNDLE/codex_skills/wikitool-operator/SKILL.md"
          test -f "$BUNDLE/integration/agent_integration.md"
          test -f "$BUNDLE/integration/site_adapters.md"
          test -f "$BUNDLE/site_adapter/generic.toml"
          test ! -e "$BUNDLE/writing_context"
          test -d "$BUNDLE/docs/wikitool"
          test ! -e "$BUNDLE/llm_instructions"
          test ! -e "$BUNDLE/SETUP.md"
          test -f "$BUNDLE/manifest.json"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ inputs.notarize_macos }}" == "true" ]]; then
              test -f "$BUNDLE/macos-release-trust.json"
              grep -q '"status": "developer_id_notarized"' "$BUNDLE/macos-release-trust.json"
            else
              test -f "$BUNDLE/macos-release-trust.json"
              grep -q '"status": "unsigned_github_release"' "$BUNDLE/macos-release-trust.json"
            fi
          fi
          test -f "$BUNDLE/contextmink/contextmink"
          test -f "$BUNDLE/contextmink/README.md"
          test -f "$BUNDLE/contextmink/SETUP.md"
          test -d "$BUNDLE/contextmink/templates"
          test ! -e "$BUNDLE/contextmink/contextmink-bridge"
          "$BUNDLE/contextmink/contextmink" --version
          smoke="$RUNNER_TEMP/wikitool-contextmink-install"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          "$BUNDLE/contextmink/contextmink" setup-project "$smoke" --skill-target both --json
          test -f "$smoke/tools/contextmink/bin/contextmink"
          "$smoke/tools/contextmink/bin/contextmink" --version
          test -f "$smoke/tools/contextmink/project-install.json"
          test -f "$smoke/.agents/skills/contextmink/SKILL.md"
          test -f "$smoke/.claude/skills/contextmink/SKILL.md"
          test -f "${BUNDLE}.zip"

      - name: Test unsigned macOS trust declaration
        if: runner.os == 'macOS' && !inputs.notarize_macos
        shell: bash
        run: bash scripts/test_unsigned_macos_release.sh

      - name: Verify packaged release (Windows)
        if: runner.os == 'Windows'
        env:
          BUNDLE: dist/release-matrix/${{ steps.names.outputs.bundle }}
        run: |
          if (!(Test-Path "$env:BUNDLE/${{ matrix.binary_name }}")) { throw "release binary missing" }
          & "$env:BUNDLE/${{ matrix.binary_name }}" --version
          if (!(Test-Path "$env:BUNDLE/AGENTS.md")) { throw "AGENTS.md missing" }
          if (!(Test-Path "$env:BUNDLE/CLAUDE.md")) { throw "CLAUDE.md missing" }
          if (!(Test-Path "$env:BUNDLE/.claude/rules")) { throw ".claude/rules missing" }
          if (!(Test-Path "$env:BUNDLE/.claude/skills")) { throw ".claude/skills missing" }
          $agentsHash = (Get-FileHash -Path "$env:BUNDLE/AGENTS.md" -Algorithm SHA256).Hash
          $claudeHash = (Get-FileHash -Path "$env:BUNDLE/CLAUDE.md" -Algorithm SHA256).Hash
          if ($agentsHash -ne $claudeHash) { throw "AGENTS.md and CLAUDE.md mismatch" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/wiki-writing/SKILL.md")) { throw "wiki-writing skill missing" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/prose-review/SKILL.md")) { throw "prose-review skill missing" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/wiki-interview/SKILL.md")) { throw "wiki-interview skill missing" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/wikitool-operator/SKILL.md")) { throw "wikitool-operator skill missing" }
          if (!(Test-Path "$env:BUNDLE/integration/agent_integration.md")) { throw "agent integration guidance missing" }
          if (!(Test-Path "$env:BUNDLE/integration/site_adapters.md")) { throw "site adapter guidance missing" }
          if (!(Test-Path "$env:BUNDLE/site_adapter/generic.toml")) { throw "generic site adapter missing" }
          if (Test-Path "$env:BUNDLE/writing_context") { throw "retired writing_context directory must not ship" }
          if (!(Test-Path "$env:BUNDLE/docs/wikitool")) { throw "docs/wikitool missing" }
          if (Test-Path "$env:BUNDLE/llm_instructions") { throw "legacy llm_instructions directory must not ship" }
          if (Test-Path "$env:BUNDLE/SETUP.md") { throw "SETUP.md must not ship" }
          if (!(Test-Path "$env:BUNDLE/manifest.json")) { throw "manifest.json missing" }
          if (!(Test-Path "$env:BUNDLE/contextmink/contextmink.exe")) { throw "contextmink binary missing" }
          if (!(Test-Path "$env:BUNDLE/contextmink/contextmink-bridge.exe")) { throw "contextmink-bridge binary missing" }
          & "$env:BUNDLE/contextmink/contextmink-bridge.exe" --version
          if (!(Test-Path "$env:BUNDLE/contextmink/README.md")) { throw "contextmink README missing" }
          if (!(Test-Path "$env:BUNDLE/contextmink/templates")) { throw "contextmink templates missing" }
          & "$env:BUNDLE/contextmink/contextmink.exe" --version
          $smoke = Join-Path $env:RUNNER_TEMP "wikitool-contextmink-install"
          if (Test-Path $smoke) { Remove-Item -LiteralPath $smoke -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          & "$env:BUNDLE/contextmink/contextmink.exe" setup-project $smoke --skill-target both --json
          if (!(Test-Path "$smoke/tools/contextmink/bin/contextmink.exe")) { throw "installed contextmink missing" }
          if (!(Test-Path "$smoke/tools/contextmink/bin/contextmink-bridge.exe")) { throw "installed contextmink bridge missing" }
          if (!(Test-Path "$smoke/tools/contextmink/project-install.json")) { throw "Contextmink setup receipt missing" }
          if (!(Test-Path "$smoke/.agents/skills/contextmink/SKILL.md")) { throw "Contextmink Agent Skill missing" }
          if (!(Test-Path "$smoke/.claude/skills/contextmink/SKILL.md")) { throw "Contextmink Claude skill missing" }
          & "$smoke/tools/contextmink/bin/contextmink.exe" --version
          Push-Location $smoke
          try {
            & ".\tools\contextmink\bin\contextmink-bridge.exe" --script scripts/contextmink --version
          } finally {
            Pop-Location
          }
          if (!(Test-Path "${env:BUNDLE}.zip")) { throw "zip artifact missing" }

      - uses: actions/upload-artifact@v7
        with:
          name: wikitool-release-${{ steps.names.outputs.version }}-${{ matrix.platform }}
          path: dist/release-matrix/${{ steps.names.outputs.bundle }}.zip
          if-no-files-found: error

      - name: Upload notarization evidence
        if: always() && runner.os == 'macOS' && inputs.notarize_macos
        uses: actions/upload-artifact@v7
        with:
          name: wikitool-notarization-${{ steps.names.outputs.version }}-${{ matrix.platform }}
          path: dist/notarization/${{ steps.names.outputs.bundle }}/
          if-no-files-found: warn

      - name: Remove temporary Apple signing material
        if: always() && runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/wikitool-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f \
            "$RUNNER_TEMP/wikitool-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  publish-release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: ver
        run: echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.artifact_version }}

      - uses: actions/download-artifact@v8
        with:
          path: release-zips
          pattern: wikitool-release-${{ steps.ver.outputs.version }}-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh release-zips/

      - name: Generate release checksums
        run: |
          cd release-zips
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Keep a Changelog headings: "## [x.y.z] - date". Capture the body
          # up to the next "## " heading; fail if the section is missing so a
          # release can never ship without written notes.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}; add one before releasing." >&2
            exit 1
          fi
          cat release_body.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --title "wikitool ${{ steps.ver.outputs.version }}" \
            --notes-file release_body.md \
            release-zips/*.zip \
            release-zips/SHA256SUMS.txt
