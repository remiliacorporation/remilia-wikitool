name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.3.1)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release and attach zips"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary_name: wikitool
          # macos-26 is arm64; macos-26-intel is x64. Keep these explicit so
          # each artifact is built on the native architecture it ships for.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary_name: wikitool
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary_name: wikitool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary_name: wikitool.exe

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve release names
        id: names
        shell: bash
        env:
          RAW: ${{ inputs.artifact_version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Release versions are bare semver (no leading v); strip one if present.
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          if [[ ! "${RAW}" =~ $re ]]; then
            echo "Invalid artifact_version: ${RAW}"
            echo "Expected a bare semver version, e.g. 0.3.1"
            exit 1
          fi
          version="${RAW#v}"
          bash scripts/validate_release_dispatch.sh \
            "$version" "$CREATE_RELEASE" "$RELEASE_REF"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundle=wikitool-${version}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Stage pinned Contextmink release pack
        shell: bash
        run: >
          bash scripts/fetch_contextmink.sh
          --platform ${{ matrix.platform }}
          --dest dist/contextmink-dist

      - name: Stage pinned Papertiger release pack
        shell: bash
        run: >
          bash scripts/fetch_papertiger.sh
          --platform ${{ matrix.platform }}
          --dest dist/papertiger-dist

      - name: Build + package versioned release bundle
        run: >
          cargo run --quiet --package wikitool --features maintainer --
          release build-matrix
          --targets ${{ matrix.target }}
          --artifact-version ${{ steps.names.outputs.version }}
          --output-dir dist/release-matrix
          --contextmink-dist dist/contextmink-dist
          --papertiger-dist dist/papertiger-dist

      - name: Declare unsigned GitHub macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/release-matrix/${{ steps.names.outputs.bundle }}"
          bash scripts/declare_unsigned_macos.sh --bundle-dir "$bundle"
          rm -f "${bundle}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "${bundle}.zip"
          (
            cd dist/release-matrix
            shasum -a 256 *.zip | sort -k2 > SHA256SUMS.txt
          )
          echo "::warning::macOS archive is unsigned; Gatekeeper exception instructions are bundled"

      - name: Verify packaged release (Unix)
        if: runner.os != 'Windows'
        env:
          BUNDLE: dist/release-matrix/${{ steps.names.outputs.bundle }}
        run: |
          test -f "$BUNDLE/${{ matrix.binary_name }}"
          "$BUNDLE/${{ matrix.binary_name }}" --version
          test -f "$BUNDLE/AGENTS.md"
          test -f "$BUNDLE/CLAUDE.md"
          test -d "$BUNDLE/.claude/rules"
          test -d "$BUNDLE/.claude/skills"
          cmp -s "$BUNDLE/AGENTS.md" "$BUNDLE/CLAUDE.md"
          test -f "$BUNDLE/codex_skills/wiki-writing/SKILL.md"
          test -f "$BUNDLE/codex_skills/prose-review/SKILL.md"
          test -f "$BUNDLE/codex_skills/wiki-interview/SKILL.md"
          test -f "$BUNDLE/codex_skills/wikitool-operator/SKILL.md"
          test -f "$BUNDLE/integration/agent_integration.md"
          test -f "$BUNDLE/integration/site_adapters.md"
          test -f "$BUNDLE/site_adapter/generic.toml"
          test ! -e "$BUNDLE/writing_context"
          test -d "$BUNDLE/docs/wikitool"
          test ! -e "$BUNDLE/llm_instructions"
          test ! -e "$BUNDLE/SETUP.md"
          test -f "$BUNDLE/manifest.json"
          test -f "$BUNDLE/release-companions.json"
          grep -q '"schema": "wikitool.release-companions.v1"' "$BUNDLE/release-companions.json"
          grep -q '"required_for_wikitool": false' "$BUNDLE/release-companions.json"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test -f "$BUNDLE/macos-release-trust.json"
            grep -q '"status": "unsigned_github_release"' "$BUNDLE/macos-release-trust.json"
          fi
          test -f "$BUNDLE/contextmink/contextmink"
          test -f "$BUNDLE/contextmink/README.md"
          test -f "$BUNDLE/contextmink/SETUP.md"
          test -d "$BUNDLE/contextmink/templates"
          test ! -e "$BUNDLE/contextmink/contextmink-bridge"
          "$BUNDLE/contextmink/contextmink" --version
          test -f "$BUNDLE/papertiger/papertiger"
          test -f "$BUNDLE/papertiger/papertiger-mise"
          test -f "$BUNDLE/papertiger/agent_integration.md"
          test -f "$BUNDLE/papertiger/manifest.json"
          test -f "$BUNDLE/papertiger/archive.sha256"
          "$BUNDLE/papertiger/papertiger" --version
          "$BUNDLE/papertiger/papertiger-mise" --version
          runner_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          smoke="$runner_temp/wikitool-contextmink-install"
          case "$smoke" in "$runner_temp"/*) ;; *) echo "unsafe smoke path: $smoke" >&2; exit 1 ;; esac
          rm -rf "$smoke"
          mkdir -p "$smoke"
          "$BUNDLE/contextmink/contextmink" setup-project "$smoke" --skill-target both --json
          test -f "$smoke/tools/contextmink/bin/contextmink"
          "$smoke/tools/contextmink/bin/contextmink" --version
          test -f "$smoke/tools/contextmink/project-install.json"
          test -f "$smoke/.agents/skills/contextmink/SKILL.md"
          test -f "$smoke/.claude/skills/contextmink/SKILL.md"
          papertiger_smoke="$runner_temp/wikitool-papertiger-install"
          case "$papertiger_smoke" in "$runner_temp"/*) ;; *) echo "unsafe Papertiger smoke path: $papertiger_smoke" >&2; exit 1 ;; esac
          rm -rf "$papertiger_smoke"
          mkdir -p "$papertiger_smoke"
          "$BUNDLE/papertiger/papertiger" setup-project "$papertiger_smoke" --skill-target both --dry-run --json
          test ! -e "$papertiger_smoke/tools/papertiger/project-install.json"
          "$BUNDLE/papertiger/papertiger" setup-project "$papertiger_smoke" --skill-target both --json
          "$BUNDLE/papertiger/papertiger" setup-project "$papertiger_smoke" --json
          test -f "$papertiger_smoke/tools/papertiger/bin/papertiger"
          test -f "$papertiger_smoke/tools/papertiger/project-install.json"
          test -f "$papertiger_smoke/tools/papertiger/agent_integration.md"
          test -f "$papertiger_smoke/.agents/skills/papertiger/SKILL.md"
          test -f "$papertiger_smoke/.claude/skills/papertiger/SKILL.md"
          test ! -e "$papertiger_smoke/state/papertiger.sqlite"
          "$BUNDLE/papertiger/papertiger" uninstall-project "$papertiger_smoke" --json
          test ! -e "$papertiger_smoke/tools/papertiger/project-install.json"
          test ! -e "$papertiger_smoke/tools/papertiger/bin/papertiger"
          test ! -e "$papertiger_smoke/.agents/skills/papertiger/SKILL.md"
          test ! -e "$papertiger_smoke/.claude/skills/papertiger/SKILL.md"
          test ! -e "$papertiger_smoke/state/papertiger.sqlite"
          test -f "${BUNDLE}.zip"

      - name: Test unsigned macOS trust declaration
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test_unsigned_macos_release.sh

      - name: Verify packaged release (Windows)
        if: runner.os == 'Windows'
        env:
          BUNDLE: dist/release-matrix/${{ steps.names.outputs.bundle }}
        run: |
          if (!(Test-Path "$env:BUNDLE/${{ matrix.binary_name }}")) { throw "release binary missing" }
          & "$env:BUNDLE/${{ matrix.binary_name }}" --version
          if (!(Test-Path "$env:BUNDLE/AGENTS.md")) { throw "AGENTS.md missing" }
          if (!(Test-Path "$env:BUNDLE/CLAUDE.md")) { throw "CLAUDE.md missing" }
          if (!(Test-Path "$env:BUNDLE/.claude/rules")) { throw ".claude/rules missing" }
          if (!(Test-Path "$env:BUNDLE/.claude/skills")) { throw ".claude/skills missing" }
          $agentsHash = (Get-FileHash -Path "$env:BUNDLE/AGENTS.md" -Algorithm SHA256).Hash
          $claudeHash = (Get-FileHash -Path "$env:BUNDLE/CLAUDE.md" -Algorithm SHA256).Hash
          if ($agentsHash -ne $claudeHash) { throw "AGENTS.md and CLAUDE.md mismatch" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/wiki-writing/SKILL.md")) { throw "wiki-writing skill missing" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/prose-review/SKILL.md")) { throw "prose-review skill missing" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/wiki-interview/SKILL.md")) { throw "wiki-interview skill missing" }
          if (!(Test-Path "$env:BUNDLE/codex_skills/wikitool-operator/SKILL.md")) { throw "wikitool-operator skill missing" }
          if (!(Test-Path "$env:BUNDLE/integration/agent_integration.md")) { throw "agent integration guidance missing" }
          if (!(Test-Path "$env:BUNDLE/integration/site_adapters.md")) { throw "site adapter guidance missing" }
          if (!(Test-Path "$env:BUNDLE/site_adapter/generic.toml")) { throw "generic site adapter missing" }
          if (Test-Path "$env:BUNDLE/writing_context") { throw "retired writing_context directory must not ship" }
          if (!(Test-Path "$env:BUNDLE/docs/wikitool")) { throw "docs/wikitool missing" }
          if (Test-Path "$env:BUNDLE/llm_instructions") { throw "legacy llm_instructions directory must not ship" }
          if (Test-Path "$env:BUNDLE/SETUP.md") { throw "SETUP.md must not ship" }
          if (!(Test-Path "$env:BUNDLE/manifest.json")) { throw "manifest.json missing" }
          if (!(Test-Path "$env:BUNDLE/release-companions.json")) { throw "release companion manifest missing" }
          $companionManifest = Get-Content "$env:BUNDLE/release-companions.json" -Raw | ConvertFrom-Json
          if ($companionManifest.schema -ne "wikitool.release-companions.v1") { throw "release companion schema mismatch" }
          if (@($companionManifest.companions | Where-Object { $_.required_for_wikitool }).Count -ne 0) { throw "optional companion marked required" }
          if (!(Test-Path "$env:BUNDLE/contextmink/contextmink.exe")) { throw "contextmink binary missing" }
          if (!(Test-Path "$env:BUNDLE/contextmink/contextmink-bridge.exe")) { throw "contextmink-bridge binary missing" }
          & "$env:BUNDLE/contextmink/contextmink-bridge.exe" --version
          if (!(Test-Path "$env:BUNDLE/contextmink/README.md")) { throw "contextmink README missing" }
          if (!(Test-Path "$env:BUNDLE/contextmink/templates")) { throw "contextmink templates missing" }
          & "$env:BUNDLE/contextmink/contextmink.exe" --version
          if (!(Test-Path "$env:BUNDLE/papertiger/papertiger.exe")) { throw "papertiger binary missing" }
          if (!(Test-Path "$env:BUNDLE/papertiger/papertiger-mise.exe")) { throw "papertiger-mise binary missing" }
          if (!(Test-Path "$env:BUNDLE/papertiger/agent_integration.md")) { throw "Papertiger agent contract missing" }
          if (!(Test-Path "$env:BUNDLE/papertiger/manifest.json")) { throw "Papertiger manifest missing" }
          if (!(Test-Path "$env:BUNDLE/papertiger/archive.sha256")) { throw "Papertiger archive receipt missing" }
          & "$env:BUNDLE/papertiger/papertiger.exe" --version
          & "$env:BUNDLE/papertiger/papertiger-mise.exe" --version
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([System.IO.Path]::DirectorySeparatorChar)
          $smoke = [System.IO.Path]::GetFullPath((Join-Path $runnerTemp "wikitool-contextmink-install"))
          if ([System.IO.Path]::GetDirectoryName($smoke) -ne $runnerTemp) { throw "unsafe Contextmink smoke path: $smoke" }
          if (Test-Path $smoke) { Remove-Item -LiteralPath $smoke -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          & "$env:BUNDLE/contextmink/contextmink.exe" setup-project $smoke --skill-target both --json
          if (!(Test-Path "$smoke/tools/contextmink/bin/contextmink.exe")) { throw "installed contextmink missing" }
          if (!(Test-Path "$smoke/tools/contextmink/bin/contextmink-bridge.exe")) { throw "installed contextmink bridge missing" }
          if (!(Test-Path "$smoke/tools/contextmink/project-install.json")) { throw "Contextmink setup receipt missing" }
          if (!(Test-Path "$smoke/.agents/skills/contextmink/SKILL.md")) { throw "Contextmink Agent Skill missing" }
          if (!(Test-Path "$smoke/.claude/skills/contextmink/SKILL.md")) { throw "Contextmink Claude skill missing" }
          & "$smoke/tools/contextmink/bin/contextmink.exe" --version
          Push-Location $smoke
          try {
            & ".\tools\contextmink\bin\contextmink-bridge.exe" --script scripts/contextmink --version
          } finally {
            Pop-Location
          }
          $papertigerSmoke = [System.IO.Path]::GetFullPath((Join-Path $runnerTemp "wikitool-papertiger-install"))
          if ([System.IO.Path]::GetDirectoryName($papertigerSmoke) -ne $runnerTemp) { throw "unsafe Papertiger smoke path: $papertigerSmoke" }
          if (Test-Path $papertigerSmoke) { Remove-Item -LiteralPath $papertigerSmoke -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $papertigerSmoke | Out-Null
          & "$env:BUNDLE/papertiger/papertiger.exe" setup-project $papertigerSmoke --skill-target both --dry-run --json
          if (Test-Path "$papertigerSmoke/tools/papertiger/project-install.json") { throw "Papertiger dry-run wrote a receipt" }
          & "$env:BUNDLE/papertiger/papertiger.exe" setup-project $papertigerSmoke --skill-target both --json
          & "$env:BUNDLE/papertiger/papertiger.exe" setup-project $papertigerSmoke --json
          if (!(Test-Path "$papertigerSmoke/tools/papertiger/bin/papertiger.exe")) { throw "installed Papertiger missing" }
          if (!(Test-Path "$papertigerSmoke/tools/papertiger/project-install.json")) { throw "Papertiger setup receipt missing" }
          if (!(Test-Path "$papertigerSmoke/tools/papertiger/agent_integration.md")) { throw "Papertiger installed contract missing" }
          if (!(Test-Path "$papertigerSmoke/.agents/skills/papertiger/SKILL.md")) { throw "Papertiger Agent Skill missing" }
          if (!(Test-Path "$papertigerSmoke/.claude/skills/papertiger/SKILL.md")) { throw "Papertiger Claude skill missing" }
          if (Test-Path "$papertigerSmoke/state/papertiger.sqlite") { throw "Papertiger setup must not create task authority" }
          & "$env:BUNDLE/papertiger/papertiger.exe" uninstall-project $papertigerSmoke --json
          if (Test-Path "$papertigerSmoke/tools/papertiger/project-install.json") { throw "Papertiger uninstall retained receipt" }
          if (Test-Path "$papertigerSmoke/tools/papertiger/bin/papertiger.exe") { throw "Papertiger uninstall retained binary" }
          if (Test-Path "$papertigerSmoke/.agents/skills/papertiger/SKILL.md") { throw "Papertiger uninstall retained Agent Skill" }
          if (Test-Path "$papertigerSmoke/.claude/skills/papertiger/SKILL.md") { throw "Papertiger uninstall retained Claude skill" }
          if (Test-Path "$papertigerSmoke/state/papertiger.sqlite") { throw "Papertiger uninstall created task authority" }
          if (!(Test-Path "${env:BUNDLE}.zip")) { throw "zip artifact missing" }

      - uses: actions/upload-artifact@v7
        with:
          name: wikitool-release-${{ steps.names.outputs.version }}-${{ matrix.platform }}
          path: dist/release-matrix/${{ steps.names.outputs.bundle }}.zip
          if-no-files-found: error

  publish-release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: ver
        run: echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW: ${{ inputs.artifact_version }}

      - uses: actions/download-artifact@v8
        with:
          path: release-zips
          pattern: wikitool-release-${{ steps.ver.outputs.version }}-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh release-zips/

      - name: Generate release checksums
        run: |
          cd release-zips
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Keep a Changelog headings: "## [x.y.z] - date". Capture the body
          # up to the next "## " heading; fail if the section is missing so a
          # release can never ship without written notes.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}; add one before releasing." >&2
            exit 1
          fi
          cat release_body.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "wikitool ${{ steps.ver.outputs.version }}" \
            --notes-file release_body.md \
            release-zips/*.zip \
            release-zips/SHA256SUMS.txt
