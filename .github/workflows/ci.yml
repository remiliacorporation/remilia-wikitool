name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo tests
        run: cargo test --workspace --all-features
      - name: Generated CLI reference is current
        run: |
          cargo run --quiet --package wikitool --features maintainer -- docs generate-reference --output /tmp/wikitool-reference.md
          diff -u docs/wikitool/reference.md /tmp/wikitool-reference.md
      - name: Release dispatch guard
        run: bash tests/release_dispatch.sh

  cli-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build default end-user and test binaries
        run: cargo build --package wikitool --package wikitest
      - name: Validate manifests and fixture identities
        run: cargo run --quiet --package wikitest -- validate
      - name: Public CLI regressions
        run: cargo run --quiet --package wikitest -- suite wikitool-regressions --require-all
      - name: Retain replayable regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikitest-regressions-${{ matrix.os }}
          path: |
            .wikitest/runs
            target/debug/wikitool
            target/debug/wikitool.exe
            target/debug/wikitest
            target/debug/wikitest.exe
          if-no-files-found: error

  rust-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # Stable toolchain: avoids the maintenance and spurious red of a pinned
      # nightly. Only goes red on real fmt/clippy issues in committed code.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
