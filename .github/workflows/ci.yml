name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo tests
        run: cargo test --workspace
      - name: Generated CLI reference is current
        run: |
          cargo run --quiet --package wikitool --features maintainer -- docs generate-reference --output /tmp/wikitool-reference.md
          diff -u docs/wikitool/reference.md /tmp/wikitool-reference.md
      - name: Wikitest evaluation authority
        run: |
          set -euo pipefail
          cargo build --package wikitool --package wikitest
          ./target/debug/wikitest validate
          ./target/debug/wikitest suite core-dogfood --require-all &
          core_pid=$!
          ./target/debug/wikitest prose prepare-suite prose-dogfood &
          prose_pid=$!
          core_status=0
          prose_status=0
          wait "$core_pid" || core_status=$?
          wait "$prose_pid" || prose_status=$?
          if [[ "$core_status" -ne 0 || "$prose_status" -ne 0 ]]; then
            echo "Wikitest suites failed: core=${core_status}, prose=${prose_status}" >&2
            exit 1
          fi
      - name: CLI compatibility regressions
        run: bash tests/cli_compat/cli_tests.sh
      - name: Release dispatch guard
        run: bash tests/release_dispatch.sh

  rust-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # Stable toolchain: avoids the maintenance and spurious red of a pinned
      # nightly. Only goes red on real fmt/clippy issues in committed code.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
