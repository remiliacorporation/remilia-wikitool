schema_version = "profile_policy_v2"
profile_id = "remilia"
base_profile_id = "mediawiki-generic"
docs_profile = "remilia-wiki"

[authoring]
require_short_description = true
short_description_forms = ["magic_word:SHORTDESC"]
require_article_quality_banner = true
article_quality_template = "Template:Article quality"
article_quality_default_state = "unverified"
required_appendix_sections = ["References"]
references_template = "Template:Reflist"
prefer_sentence_case_headings = true
prefer_wikitext_only = true
forbid_markdown = true
require_straight_quotes = true

[citations]
use_named_references = true
leave_archive_fields_blank = true

[[citations.preferred_templates]]
family = "web"
template_title = "Template:Cite web"

[[citations.preferred_templates]]
family = "tweet"
template_title = "Template:Cite tweet"

[[citations.preferred_templates]]
family = "news"
template_title = "Template:Cite news"

[[citations.preferred_templates]]
family = "post"
template_title = "Template:Cite post"

[[citations.preferred_templates]]
family = "video"
template_title = "Template:Cite video"

[[citations.unreliable_sources]]
label = "IQ.wiki (iq.wiki)"
matcher = "iq.wiki"

[[citations.unreliable_sources]]
label = "Know Your Meme (knowyourmeme.com)"
matcher = "knowyourmeme.com"

[[citations.unreliable_sources]]
label = "NFT Price Floor (nftpricefloor.com)"
matcher = "nftpricefloor.com"

[[citations.unreliable_sources]]
label = "Urban Dictionary (urbandictionary.com)"
matcher = "urbandictionary.com"

[remilia]

[[remilia.infobox_preferences]]
subject_type = "Person"
template_title = "Template:Infobox person"

[[remilia.infobox_preferences]]
subject_type = "Organization/Group"
template_title = "Template:Infobox organization"

[[remilia.infobox_preferences]]
subject_type = "NFT Collection"
template_title = "Template:Infobox NFT collection"

[[remilia.infobox_preferences]]
subject_type = "Artwork"
template_title = "Template:Infobox artwork"

[[remilia.infobox_preferences]]
subject_type = "Website/Platform"
template_title = "Template:Infobox website"

[[remilia.infobox_preferences]]
subject_type = "Concept/Philosophy"
template_title = "Template:Infobox concept"

[[remilia.infobox_preferences]]
subject_type = "Exhibition"
template_title = "Template:Infobox exhibition"

[[remilia.infobox_preferences]]
subject_type = "General/Other"
template_title = "Template:Infobox subject"

[categories]
preferred_categories = []

[lint]
forbid_curly_quotes = true
proper_nouns = ["Webring", "Milady", "Remilia", "Remilio", "Radbro", "Bonkler", "Pixelady", "Schizo"]
discouraged_relationship_headings = [
  "Relation to Remilia",
  "Relationship to Remilia",
  "Connection to Remilia",
  "Relation to Remilia Corporation",
  "Relationship to Remilia Corporation",
  "Connection to Remilia Corporation",
  "Relation to Remilia and adjacent communities",
]
discouraged_lead_relationship_terms = ["Remilia", "Charlotte Fang"]
forbid_placeholder_fragments = [
  "[Author Name]",
  "INSERT_SOURCE_URL",
  "2025-XX-XX",
  "https://www.example.com/source",
  "citeturn0search0",
  "contentReference[oaicite:0]",
  "oai_citation",
  "({\"attribution\":{\"attributableIndex\":\"...\"}})",
  "attached_file:1",
  "[cite_start]",
  "[cite: N]",
]
synthetic_phrase_prompts = [
  "serves as a testament",
  "is a testament to",
  "pivotal role",
  "underscores its importance",
  "highlights its significance",
  "enduring legacy",
  "rich tapestry",
  "continues to captivate",
  "it's important to note",
]

[golden_set]
article_corpus_available = false
source_documents = [
  "tools/wikitool/ai-pack/writing_context/article_structure.md",
  "tools/wikitool/ai-pack/writing_context/style_rules.md",
  "tools/wikitool/ai-pack/writing_context/writing_guide.md",
]

[[extension_contracts]]
kind = "tag"
name = "math"
provider = "Math"
syntax = "paired"
body_required = true
example = "<math>E = mc^2</math>\n<math>\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}</math>"

[[extension_contracts]]
kind = "tag"
name = "syntaxhighlight"
provider = "SyntaxHighlight"
syntax = "paired"
body_required = true
attributes = ["lang"]
example = '''<syntaxhighlight lang="solidity">
contract Milady {
    uint256 public totalSupply = 10000;
}
</syntaxhighlight>'''

[[extension_contracts]]
kind = "tag"
name = "poem"
provider = "Poem"
syntax = "paired"
body_required = true
example = '''<poem>
This is the first line.
This is the second line.
    Indented lines work too.
</poem>'''

[[extension_contracts]]
kind = "parser_function"
name = "ev"
provider = "EmbedVideo"
syntax = "parser_function"
body_required = false
example = "{{#ev:youtube|dQw4w9WgXcQ}}\n{{#ev:youtube|dQw4w9WgXcQ|description=Video caption here}}\n{{#ev:vimeo|12345678}}"

[[extension_contracts]]
kind = "tag"
name = "tabber"
provider = "TabberNeue"
syntax = "paired"
body_required = true
example = '''<tabber>
|-|Background=
[[File:Example_bg.png|thumb|Blue background]]
|-|Hair=
[[File:Example_hair.png|thumb|Hair variants]]
</tabber>'''

[[extension_contracts]]
kind = "tag"
name = "gallery"
provider = "core"
syntax = "paired"
body_required = true
attributes = ["mode", "widths", "heights", "perrow"]
example = '''<gallery>
File:Example1.png|Caption one
File:Example2.png|Caption two
File:Example3.png|Caption three
</gallery>'''

[[extension_contracts]]
kind = "tag"
name = "dpl"
provider = "DPL4"
syntax = "paired"
body_required = true
example = '''<DPL>
category = NFT Collections
count = 10
ordermethod = lastedit
order = descending
format = ,* [[%PAGE%]]\n,,
</DPL>'''

[[extension_contracts]]
kind = "tag"
name = "categorytree"
provider = "CategoryTree"
syntax = "paired"
body_required = true
example = "<categorytree>NFT Collections</categorytree>"

[[extension_contracts]]
kind = "template"
name = "lang"
provider = "core"
syntax = "template"
body_required = false
example = "{{lang|fr|deja vu}}\n{{lang|ja|kawaii}}"

[[extension_contracts]]
kind = "module"
name = "D3Chart"
provider = "local"
syntax = "module_invoke"
body_required = false
example = '''{{#invoke:D3Chart|bar
|data=Milady:100,Remilio:50,Bonkler:10
|title=Example distribution
|xLabel=Collection
|yLabel=Count
|showFrame=true
|gridStyle=dotted
}}'''
